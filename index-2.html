<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--t);font:17px/1.6 Tajawal,Tahoma,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:Amiri,serif;color:var(--g);margin:.3em 0}
.hero{text-align:center;padding:28px 12px;border:2px solid var(--au);border-radius:18px;outline:1px solid var(--au);outline-offset:-8px;background:#141414}
.hero h1{font-size:44px;margin:0;color:#fff}.hero p{margin:6px 0;color:var(--au);font-family:Amiri,serif;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{border:1.5px solid var(--au);border-radius:14px;background:#fff;color:#111;padding:20px 8px;font:700 18px Tajawal,sans-serif;cursor:pointer}
.tile:active{background:var(--g2)}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:700 16px Tajawal,sans-serif;cursor:pointer}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.d{background:#fff;color:#9b2c2c;border:1.5px solid #9b2c2c}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input,select{width:100%;padding:11px;border:1.5px solid #cfd9d3;border-radius:10px;font:16px Tajawal,sans-serif;margin:4px 0 10px}
label{font-weight:700;color:var(--g)}
.top{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--au);padding-bottom:8px;margin-bottom:12px}
.top h2{margin:0;flex:1}
.q{font-family:Amiri,serif;line-height:2.1;text-align:justify}
.q .a{cursor:pointer;border-radius:6px}.q .a.b{background:#fff3cf}.q .a.m{color:var(--g)}
.n{color:var(--au);font-size:.7em;margin:0 3px}
.li{display:flex;justify-content:space-between;align-items:center;border:1px solid #dfe7e2;border-radius:10px;padding:10px 14px;margin:6px 0;cursor:pointer}
.li small{color:var(--au)}
.big{font:36px/2.2 Amiri,serif;text-align:center;border:1.5px solid var(--au);border-radius:14px;padding:12px;margin:12px 0}
.bar{height:10px;background:var(--g2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.note{background:var(--g2);border-radius:10px;padding:12px;font-size:15px}
audio{width:100%;margin:6px 0}
</style></head><body><div id="app"></div>

async function imp(f){
 if(!f)return;const tx=await f.text(),q=[];
 tx.split(/\r?\n/).forEach(l=>{if(!l||l[0]=="#")return;const p=l.split("|");if(p.length<3)return;const s=+p[0],a=+p[1];if(s>0&&a>0){(q[s]=q[s]||[])[a-1]=p.slice(2).join("|").trim()}});
 const ok=q.length==115&&q[1]&&q[1].length==7&&q[2]&&q[2].length==286;
 if(!ok){im.innerHTML=`<div class="note">${t("bad")}</div>`;return}
 Q=q;await io("kv","put",q,"q");im.innerHTML=`<div class="note">${t("ok")} ✓</div>`;
}
function pbHtml(){return `<audio controls src="${URL.createObjectURL(blob)}"></audio><button class="btn o" onclick="saveRec()">${t("sv")}</button>`}
async function rec(){
 if(MR&&MR.state=="recording"){MR.stop();return}
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});MR=new MediaRecorder(st);const ch=[];
  MR.ondataavailable=e=>ch.push(e.data);
  MR.onstop=()=>{blob=new Blob(ch,{type:MR.mimeType});st.getTracks().forEach(x=>x.stop());rb.textContent=t("rec");pb.innerHTML=pbHtml()};
  MR.start();rb.textContent=t("stop");
 }catch(e){alert(t("mic"))}
}

<label>${l.s}</label><select onchange="L.s=+this.value;L.a=1;stopA();lcur()">${N.map((n,i)=>`<option value="${i+1}" ${L.s==i+1?"selected":""}>${i+1}. ${n}</option>`).join("")}</select>
<div class="big" id="lc" style="font-size:30px;line-height:2"></div>
<div class="row" style="justify-content:center"><button class="btn o" onclick="stepA(-1)">⏮</button><button class="btn" id="pp" onclick="tog()">▶</button><button class="btn o" onclick="stepA(1)">⏭</button></div>
<select onchange="L.rep=+this.value">${l.rp.map((x,i)=>`<option value="${i}" ${L.rep==i?"selected":""}>${x}</option>`).join("")}</select>
<label>${l.vol}</label><input type="range" min="0" max="1" step="0.05" value="${L.vol}" oninput="L.vol=+this.value;AU.volume=L.vol">
<button class="btn o" onclick="dlS()">${l.dl}</button> <span id="dlp"></span>${Q?"":`<div class="note" style="margin-top:12px">${t("need")}</div>`}`}
function lcur(){const e=document.getElementById("lc");if(e)e.innerHTML=(Q&&Q[L.s]?esc(Q[L.s][L.a-1]||""):"")+`<div style="font-size:16px;color:var(--au)">${N[L.s-1]} · ${L.a}</div>`}
function playBtn(){const b=document.getElementById("pp");if(b)b.textContent=AU.paused?"▶":"⏸"}
function stopA(){AU.pause();AU.removeAttribute("src");AU.load();playBtn()}
async function playA(){let u=aurl(L.r,L.s,L.a);try{const b=await io("kv","get",`au:${L.r}:${L.s}:${L.a}`);if(b)u=URL.createObjectURL(b)}catch(e){}AU.src=u;AU.volume=L.vol;try{await AU.play()}catch(e){}playBtn();lcur()}
function tog(){if(AU.paused){AU.getAttribute("src")?AU.play():playA()}else AU.pause();playBtn()}
function stepA(d){const n=L.a+d,c=cnt()||999;if(n<1||n>c)return;L.a=n;playA()}
AU.onplay=AU.onpause=playBtn;
AU.onended=()=>{const c=cnt();if(!c){playBtn();return}if(L.rep==1)playA();else if(L.a<c){L.a++;playA()}else if(L.rep==2){L.a=1;playA()}else playBtn()};
AU.onerror=()=>{if(AU.getAttribute("src"))alert(LT[S.lang].err);playBtn()};
async function dlS(){const c=cnt(),e=document.getElementById("dlp");if(!c){alert(t("need"));return}try{for(let a=1;a<=c;a++){const k=`au:${L.r}:${L.s}:${a}`;if(!(await io("kv","get",k))){const r=await fetch(aurl(L.r,L.s,a));if(!r.ok)throw 0;await io("kv","put",await r.blob(),k)}e.textContent=a+"/"+c}e.textContent="✓ "+c+"/"+c}catch(x){e.textContent=LT[S.lang].err}}

const TJ=[["أحكام النون الساكنة والتنوين", "لهما أربعة أحكام: الإظهار، والإدغام، والإقلاب، والإخفاء. النون الساكنة تأتي في الاسم والفعل والحرف، أما التنوين فيكون في آخر الاسم فقط. والحكم يُعرف من الحرف الذي يأتي بعدهما."], ["الإظهار الحلقي", "إذا جاء بعد النون الساكنة أو التنوين أحد حروف الحلق الستة (ء ه ع ح غ خ) نُطقا بوضوح من غير غنة ولا إدغام."], ["الإدغام", "حروفه ستة مجموعة في كلمة «يرملون» (ي ر م ل و ن).<br>• بغنة: ي ن م و (تجمعها «ينمو»).<br>• بلا غنة: اللام والراء.<br>ويُشترط أن يكون الحرفان في كلمتين مختلفتين."], ["الإقلاب", "حرفه الباء فقط. إذا جاءت الباء بعد النون الساكنة أو التنوين قُلبت النون ميماً مخفاة مع غنة."], ["الإخفاء", "حروفه خمسة عشر: ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك. يُنطق فيه بالنون أو التنوين بين الإظهار والإدغام، مع غنة."], ["أحكام الميم الساكنة", "ثلاثة أحكام:<br>• إخفاء شفوي: عند الباء.<br>• إدغام مثلين صغير: عند الميم.<br>• إظهار شفوي: عند باقي الحروف."], ["المدود", "• المد الطبيعي: حركتان.<br>• المد المتصل: الهمزة بعد حرف المد في كلمة واحدة، وهو واجب (4 إلى 5 حركات).<br>• المد المنفصل: الهمزة في كلمة بعد حرف المد في كلمة قبلها، وهو جائز (2 إلى 5 حركات).<br>• المد اللازم: السكون الأصلي بعد حرف المد، ويُمد 6 حركات.<br>• المد العارض للسكون: عند الوقف."], ["مخارج الحروف", "خمسة مواضع عامة: الجوف (حروف المد)، والحلق، واللسان، والشفتان، والخيشوم (للغنة). يُتقن النطق بسماع المعلّم وتقليده."], ["صفات الحروف", "من أهمها:<br>• حروف الاستعلاء (تُفخَّم): خ ص ض غ ط ق ظ.<br>• حروف القلقلة: ق ط ب ج د.<br>تُعرف الصفات بالتدرّب والاستماع إلى القارئ."], ["أحكام الراء", "تُفخَّم الراء إذا كانت مفتوحة أو مضمومة، وتُرقَّق إذا كانت مكسورة. وللراء الساكنة أحكام تتبع ما قبلها وما بعدها، يوضحها المعلّم."], ["أحكام اللام", "• لام لفظ الجلالة: تُفخَّم بعد فتح أو ضم، وتُرقَّق بعد كسر.<br>• اللام الشمسية: تُدغم في الحرف بعدها.<br>• اللام القمرية: تُظهر."]];
function tjUI(){const i=P[0];if(i==null)return hdr(t("tajweed"))+TJ.map((x,k)=>`<div class="li" onclick="go('tajweed',${k})"><span>${k+1}. ${x[0]}</span></div>`).join("")+`<div class="note">ملخصات تعليمية مبسّطة. راجعها مع معلّم تجويد، ولا تعتمد على التطبيق وحده للحكم على تلاوتك.</div>`;
return hdr(TJ[i][0],"tajweed")+`<div style="font-size:19px;line-height:2.1">${TJ[i][1]}</div><div class="note" style="margin-top:12px">تدريب: افتح المصحف واقرأ آية فيها هذا الحكم بصوت مرتفع، ثم سجّل تلاوتك في «تلاواتي» وقارنها بالقارئ.</div><div class="row"><button class="btn" onclick="go('recs')">${t("recs")}</button>${i<TJ.length-1?`<button class="btn o" onclick="go('tajweed',${i+1})">${t("next")}</button>`:""}</div>`}
const DQ={ar:"تنزيل المصحف تلقائياً",en:"Download the Quran automatically",fr:"Télécharger le Coran automatiquement"};
async function getEd(ed){const r=await fetch("https://api.alquran.cloud/v1/quran/"+ed);if(!r.ok)throw 0;const j=await r.json(),q=[];j.data.surahs.forEach(s=>{q[s.number]=s.ayahs.map(a=>a.text)});return q}
async function dlQ(){const e=document.getElementById("dq");e.textContent="…";try{const q=await getEd("quran-uthmani"),b=q[1][0];for(let s=2;s<=114;s++){if(s!=9&&q[s][0].startsWith(b))q[s][0]=q[s][0].slice(b.length).trim()}
if(!(q.length==115&&q[1].length==7&&q[2].length==286))throw 0;Q=q;await io("kv","put",q,"q");e.textContent=t("ok")+" ✓"}catch(x){e.textContent=LT[S.lang].err}}
